<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="228" y1="236" x2="228" y2="340">
            <stop offset="0" stop-color="#FFFFFF" />
            <stop offset="1" stop-color="#DCDCE6" />
        </linearGradient>
        <linearGradient id="rise" gradientUnits="userSpaceOnUse" x1="156" y1="326" x2="300" y2="104">
            <stop offset="0" stop-color="#4F5BD5" />
            <stop offset="0.22" stop-color="#962FBF" />
            <stop offset="0.48" stop-color="#D62976" />
            <stop offset="0.78" stop-color="#FA7E1E" />
            <stop offset="1" stop-color="#FEDA75" />
        </linearGradient>
    </defs>

    <!-- Open book: two page slabs fanning up and away from the centre gutter. -->
    <path d="M 106 240 Q 170 236 228 272 L 228 340 Q 170 304 106 308 Z" fill="url(#page)" />
    <path d="M 350 240 Q 286 236 228 272 L 228 340 Q 286 304 350 308 Z" fill="url(#page)" />

    <!-- Rising arrow, planted in the gutter like a bookmark ribbon. Gradient runs
         violet at the base (contrast against the white pages) to warm at the tip
         (contrast against the dark backplate). -->
    <path d="M 228 104 L 300 192 L 252 192 L 252 326 L 204 326 L 204 192 L 156 192 Z" fill="url(#rise)" />
</svg>
